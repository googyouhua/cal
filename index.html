<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>手机计算器</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #f8fafc;
    --muted: #a5b4cf;
    --panel: rgba(22, 32, 51, 0.92);
    --panel-edge: rgba(148, 163, 184, 0.22);
    --field: #0d1524;
    --accent: #f59e0b;
    --accent-ink: #241600;
    --danger: #fecdd3;
    --danger-bg: rgba(190, 24, 93, 0.22);
  }

  * {
    box-sizing: border-box;
  }

  [hidden] {
    display: none !important;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
  }

  body {
    min-width: 0;
    overflow-x: hidden;
    background:
      radial-gradient(circle at 15% 0%, rgba(245, 158, 11, 0.15), transparent 34%),
      radial-gradient(circle at 90% 100%, rgba(56, 189, 248, 0.13), transparent 38%),
      #080d17;
    color: var(--ink);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }

  .app {
    position: relative;
    width: min(100%, 460px);
    min-height: 100dvh;
    margin: 0 auto;
    padding: 6px 10px max(12px, env(safe-area-inset-bottom));
  }

  .app-header {
    margin: 0 2px 6px;
    padding-right: 52px;
  }

  h1 {
    margin: 0;
    font-size: clamp(20px, 6vw, 24px);
    line-height: 1.12;
    letter-spacing: 0.01em;
  }

  .subtitle {
    margin: 3px 0 0;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.3;
  }

  .panel {
    min-width: 0;
    padding: 8px;
    border: 1px solid var(--panel-edge);
    border-radius: 18px;
    background: var(--panel);
    box-shadow: 0 22px 70px rgba(0, 0, 0, 0.34);
    backdrop-filter: blur(12px);
  }

  .state-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    min-width: 0;
    margin-bottom: 6px;
  }

  .state-label {
    min-width: 0;
    color: var(--muted);
    font-size: 13px;
    font-weight: 650;
    line-height: 1.35;
  }

  button,
  input {
    font: inherit;
  }

  button {
    min-width: 0;
    min-height: 48px;
    border: 1px solid transparent;
    border-radius: 13px;
    cursor: pointer;
    touch-action: manipulation;
  }

  button:focus-visible,
  input:focus-visible {
    outline: 3px solid #fbbf24;
    outline-offset: 2px;
  }

  button:disabled,
  input:disabled {
    cursor: default;
    opacity: 0.52;
  }

  .reset-button {
    flex: 0 0 auto;
    width: 96px;
    min-height: 44px;
    padding: 0 8px;
    border-color: var(--panel-edge);
    background: #18243a;
    color: var(--ink);
    font-size: 16px;
    font-weight: 650;
  }

  .op-picker {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 6px;
    min-width: 0;
  }

  .op-picker[hidden] {
    display: none;
  }

  .op-button {
    width: 100%;
    min-height: 44px;
    border-color: rgba(251, 191, 36, 0.25);
    background: linear-gradient(180deg, #26344d, #1c293f);
    color: #fde68a;
    font-size: 22px;
    font-weight: 750;
    line-height: 1;
  }

  .op-button[aria-pressed="true"] {
    border-color: #38bdf8;
    background: linear-gradient(180deg, #23466a, #172d47);
    color: #f8fafc;
    box-shadow: inset 0 0 0 1px rgba(56, 189, 248, 0.5);
  }

  .calc-input {
    display: block;
    width: 100%;
    min-width: 0;
    min-height: 44px;
    padding: 8px 12px;
    border: 1px solid rgba(148, 163, 184, 0.3);
    border-radius: 12px;
    background: var(--field);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.25;
    cursor: default;
  }

  .calc-input::placeholder {
    color: #72819b;
    font-size: 15px;
  }

  .hint {
    display: none;
  }

  .display {
    min-width: 0;
    margin-top: 6px;
    padding: 6px 8px;
    border: 1px solid rgba(148, 163, 184, 0.16);
    border-radius: 13px;
    background: rgba(7, 12, 22, 0.76);
  }

  .display-label {
    display: none;
  }

  .expression {
    min-height: 20px;
    overflow-wrap: anywhere;
    color: #dbeafe;
    font-size: 15px;
    line-height: 1.35;
    word-break: break-word;
  }

  .expression:empty::before {
    content: "算式会显示在这里";
    color: #8291aa;
    font-size: 13px;
    line-height: 1.35;
  }

  .result {
    min-height: 34px;
    margin-top: 2px;
    overflow-wrap: anywhere;
    color: var(--accent);
    font-size: clamp(26px, 8vw, 34px);
    font-weight: 760;
    line-height: 1.05;
    word-break: break-word;
  }

  .result[data-error="true"] {
    min-height: 34px;
    padding: 5px 8px;
    border: 1px solid rgba(251, 113, 133, 0.32);
    border-radius: 9px;
    background: var(--danger-bg);
    color: var(--danger);
    font-size: 15px;
    line-height: 1.35;
  }

  .keypad {
    min-width: 0;
    margin-top: 6px;
    padding: 6px;
    border: 1px solid rgba(148, 163, 184, 0.18);
    border-radius: 14px;
    background: rgba(7, 12, 22, 0.42);
  }

  .keypad-pad {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    grid-template-areas:
      "d7 d8 d9 back"
      "d4 d5 d6 enter"
      "d1 d2 d3 enter"
      "d0 dot eq eq";
    grid-auto-rows: minmax(48px, auto);
    gap: 6px;
    min-width: 0;
    margin-top: 6px;
  }

  .key {
    width: 100%;
    min-height: 48px;
    padding: 0 4px;
    border-color: rgba(148, 163, 184, 0.24);
    background: linear-gradient(180deg, #202d44, #172236);
    color: var(--ink);
    font-size: 21px;
    font-weight: 750;
    line-height: 1;
  }

  .key[data-key="0"] { grid-area: d0; }
  .key[data-key="1"] { grid-area: d1; }
  .key[data-key="2"] { grid-area: d2; }
  .key[data-key="3"] { grid-area: d3; }
  .key[data-key="4"] { grid-area: d4; }
  .key[data-key="5"] { grid-area: d5; }
  .key[data-key="6"] { grid-area: d6; }
  .key[data-key="7"] { grid-area: d7; }
  .key[data-key="8"] { grid-area: d8; }
  .key[data-key="9"] { grid-area: d9; }
  .key[data-key="."] { grid-area: dot; }

  .key[data-key="backspace"] {
    grid-area: back;
    color: #fecdd3;
    font-size: 16px;
  }

  .key[data-key="enter"] {
    grid-area: enter;
    border-color: rgba(56, 189, 248, 0.3);
    background: linear-gradient(180deg, #1e3a5f, #14263f);
    color: #bae6fd;
    font-size: 16px;
  }

  .key[data-key="equals"] {
    grid-area: eq;
    background: linear-gradient(180deg, #fbbf24, #f59e0b);
    color: var(--accent-ink);
    font-size: 28px;
    font-weight: 800;
  }

  .edit-draft {
    min-width: 0;
    margin-top: 6px;
    padding: 8px;
    border: 1px solid rgba(251, 191, 36, 0.3);
    border-radius: 16px;
    background: rgba(245, 158, 11, 0.08);
  }

  .edit-draft[hidden] {
    display: none;
  }

  .edit-draft-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    min-width: 0;
    color: #fde68a;
    font-size: 14px;
    font-weight: 700;
  }

  .edit-operator {
    display: inline-grid;
    place-items: center;
    min-width: 32px;
    min-height: 32px;
    padding: 0 8px;
    border: 1px solid rgba(251, 191, 36, 0.4);
    border-radius: 9px;
    background: rgba(245, 158, 11, 0.16);
    color: #fef3c7;
    font-size: 20px;
  }

  .edit-cancel {
    flex: 0 0 auto;
    min-width: 64px;
    min-height: 44px;
    padding: 0 14px;
    border-color: rgba(251, 113, 133, 0.32);
    background: rgba(190, 24, 93, 0.2);
    color: #fecdd3;
    font-size: 16px;
    font-weight: 700;
  }

  .operand-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    min-width: 0;
    margin-top: 10px;
  }

  .operand-chips:empty::after {
    content: "暂无可计算数字";
    color: #c7b68f;
    font-size: 13px;
    line-height: 44px;
  }

  .operand-chip {
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
    max-width: 100%;
    padding-left: 10px;
    border: 1px solid rgba(148, 163, 184, 0.26);
    border-radius: 12px;
    background: rgba(13, 21, 36, 0.92);
  }

  .operand-input {
    width: 76px;
    min-width: 44px;
    min-height: 44px;
    padding: 8px 10px;
    border: 1px solid rgba(148, 163, 184, 0.42);
    border-radius: 9px;
    background: #111c2e;
    color: var(--ink);
    font-size: 16px;
    line-height: 1.25;
    text-align: center;
  }

  .operand-remove {
    flex: 0 0 auto;
    width: 44px;
    min-width: 44px;
    height: 44px;
    min-height: 44px;
    padding: 0;
    border-color: rgba(251, 113, 133, 0.28);
    background: rgba(190, 24, 93, 0.2);
    color: #fecdd3;
    font-size: 20px;
    line-height: 1;
  }

  .history {
    min-width: 0;
    margin-top: 10px;
    padding: 12px;
    border: 1px solid var(--panel-edge);
    border-radius: 20px;
    background: var(--panel);
  }

  .history-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    min-width: 0;
    margin-bottom: 10px;
  }

  .history-title {
    margin: 0;
    font-size: 16px;
    line-height: 1.3;
  }

  .history-note {
    color: var(--muted);
    font-size: 12px;
  }

  .history-list {
    display: grid;
    gap: 8px;
    min-width: 0;
  }

  .history-empty {
    margin: 0;
    color: #8291aa;
    font-size: 13px;
    line-height: 1.5;
  }

  .history-item {
    min-width: 0;
    padding: 10px;
    border: 1px solid rgba(148, 163, 184, 0.18);
    border-radius: 14px;
    background: rgba(7, 12, 22, 0.58);
  }

  .history-line {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 10px;
    min-width: 0;
  }

  .history-expression {
    flex: 1 1 130px;
    min-width: 0;
    overflow-wrap: anywhere;
    color: #dbeafe;
    font-size: 16px;
    line-height: 1.45;
  }

  .history-result {
    flex: 0 0 auto;
    overflow-wrap: anywhere;
    color: var(--accent);
    font-size: 20px;
    font-weight: 750;
    line-height: 1.3;
  }

  .history-edit {
    width: 100%;
    min-height: 44px;
    margin-top: 8px;
    border-color: rgba(251, 191, 36, 0.24);
    background: #1c293f;
    color: #fde68a;
    font-size: 16px;
    font-weight: 700;
  }

  .settings-toggle {
    position: absolute;
    top: 8px;
    right: 10px;
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    min-width: 44px;
    min-height: 44px;
    padding: 0;
    border: 1px solid var(--panel-edge);
    border-radius: 13px;
    background: #18243a;
    color: #fde68a;
    font-size: 22px;
    line-height: 1;
    z-index: 30;
  }

  .settings-toggle:active {
    transform: translateY(1px);
  }

  .settings-indicator {
    position: absolute;
    top: 5px;
    right: 5px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 2px #18243a;
  }

  .settings-summary {
    position: absolute;
    top: 16px;
    right: 62px;
    z-index: 29;
    padding: 3px 8px;
    border: 1px solid rgba(251, 191, 36, 0.34);
    border-radius: 999px;
    background: rgba(24, 36, 58, 0.94);
    color: #fde68a;
    font-size: 11px;
    font-weight: 700;
    line-height: 1.35;
    white-space: nowrap;
  }

  .auto-confirm-feedback {
    display: grid;
    gap: 4px;
    min-width: 0;
    margin: 3px 2px 0;
  }

  .auto-confirm-feedback[hidden] {
    display: none;
  }

  .auto-confirm-progress {
    position: relative;
    height: 2px;
    overflow: hidden;
    border-radius: 2px;
    background: rgba(148, 163, 184, 0.28);
  }

  .auto-confirm-progress::before {
    content: "";
    display: block;
    width: 100%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #fbbf24, #f59e0b);
    transform-origin: left center;
    transform: scaleX(1);
  }

  .auto-confirm-progress[data-active="true"]::before {
    animation: auto-confirm-drain var(--auto-confirm-duration, 1s) linear forwards;
  }

  .auto-confirm-countdown {
    min-width: 0;
    overflow-wrap: anywhere;
    color: #fde68a;
    font-size: 12px;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    line-height: 1.35;
  }

  .undo-hint {
    margin: 4px 2px 0;
    padding: 6px 8px;
    border: 1px solid rgba(251, 191, 36, 0.34);
    border-radius: 9px;
    background: rgba(245, 158, 11, 0.13);
    color: #fef3c7;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.35;
  }

  @keyframes auto-confirm-drain {
    from { transform: scaleX(1); }
    to { transform: scaleX(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .auto-confirm-progress[data-active="true"]::before {
      animation: none;
    }
  }

  .base-marker {
    display: inline-flex;
    align-items: center;
    min-height: 24px;
    margin-bottom: 3px;
    padding: 0 8px;
    border: 1px solid rgba(245, 158, 11, 0.42);
    border-radius: 999px;
    background: rgba(245, 158, 11, 0.14);
    color: #fde68a;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.3;
  }

  .settings-panel {
    position: fixed;
    inset: auto;
    margin: 0;
    width: min(calc(100vw - 16px), 320px);
    max-width: min(calc(100vw - 16px), 320px);
    max-height: calc(100dvh - 64px);
    overflow-y: auto;
    padding: 14px;
    border: 1px solid var(--panel-edge);
    border-radius: 16px;
    background: #101a2c;
    color: var(--ink);
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
    z-index: 50;
  }

  .settings-panel::backdrop {
    background: rgba(3, 7, 15, 0.62);
  }

  .settings-title {
    margin: 0;
    font-size: 18px;
    line-height: 1.25;
  }

  .settings-subtitle {
    margin: 4px 0 14px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.4;
  }

  .settings-field {
    display: grid;
    gap: 8px;
    min-width: 0;
    margin: 0 0 14px;
  }

  .settings-label {
    color: var(--muted);
    font-size: 14px;
    font-weight: 650;
  }

  .settings-select,
  .settings-input {
    width: 100%;
    min-width: 0;
    min-height: 44px;
    padding: 8px 12px;
    border: 1px solid rgba(148, 163, 184, 0.34);
    border-radius: 11px;
    background: var(--field);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.25;
  }

  .settings-toggle-row {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 44px;
    color: var(--ink);
    font-size: 16px;
    font-weight: 650;
    cursor: pointer;
  }

  .settings-checkbox {
    flex: 0 0 auto;
    width: 44px;
    height: 44px;
    min-width: 44px;
    min-height: 44px;
    margin: 0;
    border: 1px solid rgba(148, 163, 184, 0.42);
    border-radius: 11px;
    background: var(--field);
    appearance: none;
    -webkit-appearance: none;
    position: relative;
    cursor: pointer;
    font-size: 16px;
  }

  .settings-checkbox:checked {
    border-color: var(--accent);
    background: rgba(245, 158, 11, 0.22);
  }

  .settings-checkbox:checked::after {
    content: "✓";
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: #fde68a;
    font-size: 24px;
    font-weight: 800;
  }

  .settings-hint {
    color: #8291aa;
    font-size: 12px;
    line-height: 1.4;
  }

  .settings-done {
    width: 100%;
    min-height: 44px;
    border-color: rgba(251, 191, 36, 0.35);
    background: linear-gradient(180deg, #fbbf24, #f59e0b);
    color: var(--accent-ink);
    font-size: 16px;
    font-weight: 800;
  }

  @media (max-width: 350px) {
    .app {
      padding-left: 10px;
      padding-right: 10px;
    }

    .panel {
      padding: 10px;
    }

    .op-picker {
      gap: 7px;
    }
  }
</style>
</head>
<body>
<main class="app" data-state="select">
  <span class="settings-summary" data-testid="settings-summary" hidden>已自定义</span>
  <button class="settings-toggle" type="button" data-testid="settings-toggle" aria-label="打开统分设置" aria-haspopup="dialog" aria-expanded="false">
    <span aria-hidden="true">⚙</span>
    <span class="settings-indicator" data-testid="settings-indicator" hidden aria-hidden="true"></span>
  </button>

  <header class="app-header">
    <h1>手机计算器</h1>
    <p class="subtitle">选运算符，用屏幕数字键盘输入；= 后沿用运算符</p>
  </header>

  <section class="panel" aria-label="计算器">
    <div class="state-row">
      <span class="state-label" id="state-label" aria-live="polite">请选择运算类型</span>
      <button class="reset-button" type="button" data-testid="key-op" disabled>运算类型</button>
    </div>

    <input
      class="calc-input"
      id="calc-input"
      data-testid="calc-input"
      type="text"
      inputmode="none"
      autocomplete="off"
      spellcheck="false"
      placeholder="用下方数字键盘输入"
      aria-describedby="calc-hint"
      aria-label="数字显示"
      readonly
    >
    <div class="auto-confirm-feedback" data-testid="auto-confirm-feedback" data-active="false" hidden>
      <div class="auto-confirm-progress" data-testid="auto-confirm-progress" data-active="false" aria-hidden="true"></div>
      <div class="auto-confirm-countdown" data-testid="auto-confirm-countdown"></div>
    </div>
    <p class="hint" id="calc-hint">用屏幕数字键盘输入；按“确认”收下数字，按 = 计算。</p>
    <p class="undo-hint" data-testid="undo-hint" hidden>输错了？按“退格”可撤回上一笔。</p>

    <div class="display" aria-label="计算过程">
      <div class="display-label">算式</div>
      <div class="base-marker" data-testid="base-marker" hidden></div>
      <div class="expression" data-testid="expression" aria-live="polite"></div>
      <div class="display-label">结果</div>
      <div class="result" data-testid="result" aria-live="polite"></div>
    </div>

    <section class="keypad" data-testid="keypad" aria-label="数字键盘">
      <div class="op-picker" data-testid="op-picker" role="group" aria-label="选择运算类型">
        <button class="op-button" type="button" data-op="+" aria-label="加法">+</button>
        <button class="op-button" type="button" data-op="-" aria-label="减法">-</button>
        <button class="op-button" type="button" data-op="*" aria-label="乘法">*</button>
        <button class="op-button" type="button" data-op="/" aria-label="除法">/</button>
      </div>

      <div class="keypad-pad">
        <button class="key" type="button" data-key="7" aria-label="数字 7">7</button>
        <button class="key" type="button" data-key="8" aria-label="数字 8">8</button>
        <button class="key" type="button" data-key="9" aria-label="数字 9">9</button>
        <button class="key" type="button" data-key="backspace" aria-label="退格">退格</button>
        <button class="key" type="button" data-key="4" aria-label="数字 4">4</button>
        <button class="key" type="button" data-key="5" aria-label="数字 5">5</button>
        <button class="key" type="button" data-key="6" aria-label="数字 6">6</button>
        <button class="key" type="button" data-key="enter" aria-label="确认当前输入（回车）">确认</button>
        <button class="key" type="button" data-key="1" aria-label="数字 1">1</button>
        <button class="key" type="button" data-key="2" aria-label="数字 2">2</button>
        <button class="key" type="button" data-key="3" aria-label="数字 3">3</button>
        <button class="key" type="button" data-key="0" aria-label="数字 0">0</button>
        <button class="key" type="button" data-key="." aria-label="小数点">.</button>
        <button class="key" type="button" data-key="equals" data-testid="key-equals" aria-label="等于">=</button>
      </div>
    </section>

    <section class="edit-draft" data-testid="edit-draft" aria-label="编辑草稿" hidden>
      <div class="edit-draft-head">
        <span>编辑草稿</span>
        <span class="edit-operator" data-testid="edit-operator" aria-hidden="true">+</span>
        <span class="base-marker" data-testid="edit-base-marker" hidden></span>
        <span id="edit-hint">换运算符不会清空数字；按“确认”追加数字。</span>
        <button class="edit-cancel" type="button" data-testid="edit-cancel" aria-label="关闭编辑">关闭</button>
      </div>
      <div class="operand-chips" data-testid="operand-chips"></div>
    </section>
  </section>

  <section class="history" data-testid="history" aria-label="计算历史">
    <div class="history-head">
      <h2 class="history-title">计算历史</h2>
      <span class="history-note">仅当前页面</span>
    </div>
    <div class="history-list" data-testid="history-list"></div>
    <p class="history-empty" data-testid="history-empty">还没有计算记录。</p>
  </section>

  <dialog class="settings-panel" data-testid="settings-panel" aria-label="统分设置">
    <h2 class="settings-title">统分设置</h2>
    <p class="settings-subtitle">输入停顿后自动确认；启用基数后每笔成绩自动带上同一个基数。</p>

    <div class="settings-field">
      <label class="settings-label" for="settings-auto-confirm">自动确认停顿</label>
      <select class="settings-select" id="settings-auto-confirm" data-testid="settings-auto-confirm" aria-label="自动确认秒数"></select>
    </div>

    <div class="settings-field">
      <label class="settings-toggle-row" for="settings-base-toggle">
        <input class="settings-checkbox" id="settings-base-toggle" type="checkbox" data-testid="settings-base-toggle">
        <span>启用基数</span>
      </label>
      <input
        class="settings-input"
        id="settings-base-value"
        data-testid="settings-base-value"
        type="text"
        inputmode="decimal"
        autocomplete="off"
        spellcheck="false"
        aria-label="基数数值"
        value="0"
        disabled
      >
      <span class="settings-hint">基数作为第一笔数字，可为 0、负数或小数，不计入除数。</span>
    </div>

    <button class="settings-done" type="button" data-testid="settings-done">完成</button>
  </dialog>
</main>

<script>
  (() => {
    "use strict";

    const app = document.querySelector(".app");
    const picker = document.querySelector('[data-testid="op-picker"]');
    const input = document.querySelector('[data-testid="calc-input"]');
    const expression = document.querySelector('[data-testid="expression"]');
    const result = document.querySelector('[data-testid="result"]');
    const equalsButton = document.querySelector('[data-testid="key-equals"]');
    const resetButton = document.querySelector('[data-testid="key-op"]');
    const keypad = document.querySelector('[data-testid="keypad"]');
    const keyButtons = Array.from(keypad.querySelectorAll('[data-key]'));
    const opButtons = Array.from(picker.querySelectorAll('[data-op]'));
    const stateLabel = document.querySelector("#state-label");
    const historyList = document.querySelector('[data-testid="history-list"]');
    const historyEmpty = document.querySelector('[data-testid="history-empty"]');
    const editDraftView = document.querySelector('[data-testid="edit-draft"]');
    const editOperatorView = document.querySelector('[data-testid="edit-operator"]');
    const operandChips = document.querySelector('[data-testid="operand-chips"]');
    const editCancelButton = document.querySelector('[data-testid="edit-cancel"]');
    const settingsToggle = document.querySelector('[data-testid="settings-toggle"]');
    const settingsIndicator = document.querySelector('[data-testid="settings-indicator"]');
    const settingsSummary = document.querySelector('[data-testid="settings-summary"]');
    const settingsPanel = document.querySelector('[data-testid="settings-panel"]');
    const autoConfirmSelect = document.querySelector('[data-testid="settings-auto-confirm"]');
    const baseToggle = document.querySelector('[data-testid="settings-base-toggle"]');
    const baseValueInput = document.querySelector('[data-testid="settings-base-value"]');
    const settingsDone = document.querySelector('[data-testid="settings-done"]');
    const autoConfirmFeedback = document.querySelector('[data-testid="auto-confirm-feedback"]');
    const autoConfirmProgress = document.querySelector('[data-testid="auto-confirm-progress"]');
    const autoConfirmCountdown = document.querySelector('[data-testid="auto-confirm-countdown"]');
    const undoHint = document.querySelector('[data-testid="undo-hint"]');
    const baseMarkerView = document.querySelector('[data-testid="base-marker"]');
    const editBaseMarkerView = document.querySelector('[data-testid="edit-base-marker"]');

    const operatorGlyphs = {
      "+": "+",
      "-": "-",
      "*": "*",
      "/": "/"
    };

    let state = "select";
    let operator = null;
    let operands = [];
    let history = [];
    let editDraft = null;
    let editSnapshot = null;
    let pendingEdit = null;

    const SETTINGS_KEY = "cal-phone.settings.v1";
    const AUTO_CONFIRM_STEPS = Array.from({ length: 21 }, (_, index) => index / 2);
    const settings = {
      autoConfirm: 0,
      baseEnabled: false,
      baseText: "0"
    };
    let autoConfirmTimer = null;
    let autoConfirmCountdownTimer = null;
    let autoConfirmDeadline = 0;

    function enterState(nextState) {
      state = nextState;
      app.dataset.state = nextState;
      resetButton.disabled = nextState === "select";
      syncKeypad();
      updateBaseMarker();
      updateUndoHint();
    }

    function syncOperatorAttribute() {
      if (operator) {
        app.dataset.operator = operator;
        resetButton.textContent = `运算：${operatorGlyphs[operator]}`;
        resetButton.setAttribute("aria-label", `当前运算 ${operatorGlyphs[operator]}，点击重选`);
      } else {
        delete app.dataset.operator;
        resetButton.textContent = "运算类型";
        resetButton.setAttribute("aria-label", "重选运算类型");
      }
      opButtons.forEach((button) => {
        const selected = Boolean(operator) && button.getAttribute("data-op") === operator;
        button.setAttribute("aria-pressed", selected ? "true" : "false");
      });
    }

    function syncKeypad() {
      keyButtons.forEach((button) => {
        button.disabled = false;
      });
      opButtons.forEach((button) => {
        button.disabled = false;
      });
    }

    function appendCharacter(character) {
      if (state === "result" || state === "error") {
        operands = [];
        clearExpression();
        clearResult();
      }
      if (state === "select" || state === "result" || state === "error") {
        enterState("input");
        updateStateLabel(operator
          ? `已开始新的 ${operatorGlyphs[operator]} 计算，请继续输入`
          : "请输入数字，或先选择运算类型");
      }
      if (character === "." && input.value.includes(".")) {
        return;
      }
      input.value += character;
      startAutoConfirm();
      updateUndoHint();
    }

    function deleteLastCharacter() {
      if (input.value !== "") {
        input.value = input.value.slice(0, -1);
        startAutoConfirm();
        updateUndoHint();
        return;
      }

      if (state === "edit" && editDraft) {
        if (editDraft.operands.length > 0) {
          const removed = editDraft.operands.pop();
          renderEditDraft();
          renderExpression();
          updateUndoHint();
          updateStateLabel(`已撤回 ${removed.display}`);
        }
        return;
      }

      if (state === "input" && operands.length > 0) {
        const removed = operands.pop();
        renderExpression();
        updateUndoHint();
        updateStateLabel(`已撤回 ${removed.display}`);
      }
    }

    function clearResult() {
      result.textContent = "";
      result.removeAttribute("data-value");
      result.removeAttribute("data-error");
    }

    function clearExpression() {
      expression.textContent = "";
    }

    function cloneOperand(operand) {
      return { value: operand.value, display: operand.display };
    }

    function expressionText(activeOperator, activeOperands, activeBase = null) {
      const values = [];
      if (activeBase) {
        values.push(activeBase.display);
      }
      activeOperands.forEach((operand) => values.push(operand.display));
      if (values.length === 0) {
        return "";
      }
      return activeOperator ? values.join(` ${operatorGlyphs[activeOperator]} `) : values.join(" ");
    }

    function liveExpressionText(activeOperator, activeOperands, activeBase = null) {
      const base = expressionText(activeOperator, activeOperands, activeBase);
      if (!activeOperator || !base || activeOperands.length !== 1) {
        return base;
      }

      return `${base} ${operatorGlyphs[activeOperator]}`;
    }

    function renderExpression() {
      if (state === "edit" && editDraft) {
        expression.textContent = liveExpressionText(editDraft.operator, editDraft.operands, editDraft.base);
        updateBaseMarker();
        return;
      }

      const activeBase = operator ? effectiveBase() : null;
      if (operands.length === 0 && !activeBase) {
        clearExpression();
        updateBaseMarker();
        return;
      }

      expression.textContent = liveExpressionText(operator, operands, activeBase);
      updateBaseMarker();
    }

    function captureEditSnapshot() {
      return {
        state,
        operator,
        operands: operands.map(cloneOperand),
        expressionText: expression.textContent || "",
        resultText: result.textContent || "",
        resultValue: result.getAttribute("data-value"),
        resultError: result.getAttribute("data-error"),
        label: stateLabel.textContent
      };
    }

    function settlePendingEdit() {
      if (!pendingEdit) {
        return;
      }

      const pending = pendingEdit;
      pendingEdit = null;
      if (pending.chip) {
        pending.chip.removeAttribute("data-pending");
      }
      if (!pending.entered && pending.input && pending.input.isConnected) {
        pending.input.value = pending.original;
        if (editDraft && editDraft.operands[pending.index]) {
          editDraft.operands[pending.index] = {
            value: Number(pending.original),
            display: pending.original
          };
        }
        if (pending.chip) {
          pending.chip.setAttribute("data-value", pending.original);
        }
      }
    }

    function beginPendingEdit(operandInput, chip, index) {
      if (state !== "edit" || !editDraft || !editDraft.operands[index]) {
        return;
      }
      if (pendingEdit && pendingEdit.input === operandInput) {
        return;
      }

      settlePendingEdit();
      pendingEdit = {
        index,
        original: operandInput.value,
        entered: false,
        input: operandInput,
        chip
      };
      operandInput.value = "";
      chip.setAttribute("data-pending", "true");
    }

    function cancelEdit() {
      if (state !== "edit" || !editSnapshot) {
        return;
      }

      stopAutoConfirm();
      const snapshot = editSnapshot;
      pendingEdit = null;
      editSnapshot = null;
      editDraft = null;
      editDraftView.hidden = true;
      operandChips.textContent = "";
      operator = snapshot.operator;
      operands = snapshot.operands.map(cloneOperand);
      syncOperatorAttribute();
      expression.textContent = snapshot.expressionText;
      result.textContent = snapshot.resultText;
      if (snapshot.resultValue === null) {
        result.removeAttribute("data-value");
      } else {
        result.setAttribute("data-value", snapshot.resultValue);
      }
      if (snapshot.resultError === null) {
        result.removeAttribute("data-error");
      } else {
        result.setAttribute("data-error", snapshot.resultError);
      }
      input.value = "";
      resetButton.disabled = snapshot.state === "select";
      enterState(snapshot.state);
      updateStateLabel(snapshot.label);
      input.focus();
    }

    function updateStateLabel(label) {
      stateLabel.textContent = label;
    }

    function populateAutoConfirmOptions() {
      autoConfirmSelect.textContent = "";
      AUTO_CONFIRM_STEPS.forEach((value) => {
        const option = document.createElement("option");
        option.value = String(value);
        option.textContent = value === 0 ? "关闭" : `${value} 秒`;
        autoConfirmSelect.append(option);
      });
    }

    function loadSettings() {
      try {
        const raw = window.localStorage.getItem(SETTINGS_KEY);
        if (!raw) {
          return;
        }
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object") {
          return;
        }
        const autoConfirm = Number(parsed.autoConfirm);
        if (AUTO_CONFIRM_STEPS.includes(autoConfirm)) {
          settings.autoConfirm = autoConfirm;
        }
        settings.baseEnabled = parsed.baseEnabled === true;
        const storedBase = String(parsed.baseValue ?? "");
        if (storedBase.trim() !== "" && Number.isFinite(Number(storedBase))) {
          settings.baseText = storedBase;
        }
      } catch (error) {
        /* localStorage may be disabled; keep the in-memory defaults. */
      }
    }

    function saveSettings() {
      try {
        window.localStorage.setItem(SETTINGS_KEY, JSON.stringify({
          autoConfirm: settings.autoConfirm,
          baseEnabled: settings.baseEnabled,
          baseValue: settings.baseText
        }));
      } catch (error) {
        /* localStorage may be disabled; the page keeps working in memory. */
      }
    }

    function effectiveBase() {
      if (!settings.baseEnabled) {
        return null;
      }
      const raw = String(settings.baseText);
      if (raw.trim() === "" || !Number.isFinite(Number(raw))) {
        return null;
      }
      return { value: Number(raw), display: raw };
    }

    function updateBaseMarker() {
      const base = effectiveBase();
      const showBase = state !== "edit" && Boolean(operator) && Boolean(base);
      baseMarkerView.hidden = !showBase;
      if (showBase) {
        baseMarkerView.textContent = `基数 ${base.display}`;
      }

      const showEditBase = state === "edit" && Boolean(editDraft) && Boolean(editDraft.base);
      editBaseMarkerView.hidden = !showEditBase;
      if (showEditBase) {
        editBaseMarkerView.textContent = `基数 ${editDraft.base.display}`;
      }
    }

    function syncSettingsIndicator() {
      const customized = settings.autoConfirm > 0 || settings.baseEnabled;
      settingsIndicator.hidden = !customized;
      settingsSummary.hidden = !customized;
      settingsToggle.setAttribute("aria-label", customized ? "打开统分设置（已自定义）" : "打开统分设置");
      settingsToggle.title = customized ? "已自定义：自动确认或基数已启用" : "打开统分设置";
    }

    function updateUndoHint() {
      const inDraft = state === "edit" && Boolean(editDraft) && editDraft.operands.length > 0;
      const inInput = state === "input" && operands.length > 0;
      undoHint.hidden = !(inDraft || inInput);
      if (!inDraft && !inInput) {
        return;
      }

      const activeOperands = inDraft ? editDraft.operands : operands;
      const target = inDraft ? "草稿最后一笔" : "上一笔";
      const lastValue = activeOperands[activeOperands.length - 1].display;
      undoHint.textContent = input.value.trim() === ""
        ? `撤回${target} ${lastValue}：按“退格”。`
        : `撤回${target} ${lastValue}：先清空当前输入，再按“退格”。`;
    }

    function syncSettingsControls() {
      autoConfirmSelect.value = String(settings.autoConfirm);
      baseToggle.checked = settings.baseEnabled;
      baseValueInput.disabled = !settings.baseEnabled;
      baseValueInput.value = settings.baseText;
      syncSettingsIndicator();
      updateBaseMarker();
    }

    function autoConfirmAllowed() {
      if (!(settings.autoConfirm > 0)) {
        return false;
      }
      if (settingsPanel.open) {
        return false;
      }
      if (input.value === "" || input.value.endsWith(".")) {
        return false;
      }
      return Number.isFinite(Number(input.value));
    }

    function stopAutoConfirm() {
      if (autoConfirmTimer !== null) {
        window.clearTimeout(autoConfirmTimer);
        autoConfirmTimer = null;
      }
      if (autoConfirmCountdownTimer !== null) {
        window.clearInterval(autoConfirmCountdownTimer);
        autoConfirmCountdownTimer = null;
      }
      autoConfirmDeadline = 0;
      autoConfirmProgress.setAttribute("data-active", "false");
      autoConfirmFeedback.setAttribute("data-active", "false");
      autoConfirmFeedback.hidden = true;
      autoConfirmCountdown.textContent = "";
    }

    function syncAutoConfirmCountdown() {
      if (!autoConfirmDeadline) {
        return;
      }
      const remaining = Math.max(0, autoConfirmDeadline - Date.now());
      const seconds = (Math.ceil(remaining / 100) / 10).toFixed(1);
      autoConfirmCountdown.textContent = `正在计时：剩余 ${seconds} 秒，将确认 ${input.value.trim()}`;
    }

    function startAutoConfirm() {
      stopAutoConfirm();
      if (!autoConfirmAllowed()) {
        return;
      }
      const seconds = settings.autoConfirm;
      autoConfirmProgress.style.setProperty("--auto-confirm-duration", `${seconds}s`);
      autoConfirmDeadline = Date.now() + Math.round(seconds * 1000);
      autoConfirmFeedback.hidden = false;
      autoConfirmFeedback.setAttribute("data-active", "true");
      autoConfirmProgress.setAttribute("data-active", "false");
      void autoConfirmProgress.offsetWidth;
      autoConfirmProgress.setAttribute("data-active", "true");
      syncAutoConfirmCountdown();
      autoConfirmCountdownTimer = window.setInterval(syncAutoConfirmCountdown, 100);
      autoConfirmTimer = window.setTimeout(() => {
        autoConfirmTimer = null;
        if (autoConfirmAllowed()) {
          commitInput();
        }
        stopAutoConfirm();
      }, Math.round(seconds * 1000));
    }

    function placeSettingsPanel() {
      const rect = settingsToggle.getBoundingClientRect();
      const viewportWidth = document.documentElement.clientWidth || window.innerWidth;
      settingsPanel.style.top = `${Math.round(rect.bottom + 6)}px`;
      settingsPanel.style.right = `${Math.max(8, Math.round(viewportWidth - rect.right))}px`;
      settingsPanel.style.left = "auto";
      settingsPanel.style.bottom = "auto";
    }

    function openSettings() {
      stopAutoConfirm();
      settingsToggle.setAttribute("aria-expanded", "true");
      syncSettingsControls();
      if (typeof settingsPanel.showModal === "function") {
        if (!settingsPanel.open) {
          settingsPanel.showModal();
        }
      } else {
        settingsPanel.setAttribute("open", "");
      }
      placeSettingsPanel();
      if (!settingsPanel.contains(document.activeElement)) {
        autoConfirmSelect.focus();
      }
    }

    function closeSettings() {
      if (typeof settingsPanel.close === "function" && settingsPanel.open) {
        settingsPanel.close();
        return;
      }
      settingsPanel.removeAttribute("open");
      settingsToggle.setAttribute("aria-expanded", "false");
      settingsToggle.focus();
      syncSettingsControls();
      startAutoConfirm();
    }

    function renderEditDraft() {
      if (!editDraft) {
        editDraftView.hidden = true;
        operandChips.textContent = "";
        return;
      }

      settlePendingEdit();

      editDraftView.hidden = false;
      editDraftView.setAttribute("data-operator", editDraft.operator);
      editOperatorView.textContent = operatorGlyphs[editDraft.operator];
      operandChips.textContent = "";

      editDraft.operands.forEach((operand, index) => {
        const chip = document.createElement("div");
        chip.className = "operand-chip";
        chip.setAttribute("data-testid", "operand-chip");
        chip.setAttribute("data-value", operand.display);

        const value = document.createElement("input");
        value.type = "text";
        value.inputMode = "decimal";
        value.autocomplete = "off";
        value.spellcheck = false;
        value.className = "operand-input";
        value.setAttribute("data-testid", "operand-input");
        value.setAttribute("aria-label", `编辑数字 ${operand.display}`);
        value.value = operand.display;
        value.addEventListener("focus", () => beginPendingEdit(value, chip, index));
        value.addEventListener("click", () => beginPendingEdit(value, chip, index));
        value.addEventListener("focusout", () => {
          if (pendingEdit && pendingEdit.input === value) {
            settlePendingEdit();
          }
        });
        value.addEventListener("input", () => {
          if (state !== "edit" || !editDraft || !editDraft.operands[index]) {
            return;
          }

          if (pendingEdit && pendingEdit.input === value) {
            pendingEdit.entered = true;
          }

          editDraft.operands[index] = {
            value: Number(value.value),
            display: value.value
          };
          chip.setAttribute("data-value", value.value);
          renderExpression();
        });

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "operand-remove";
        remove.setAttribute("data-testid", "operand-remove");
        remove.setAttribute("aria-label", `删除数字 ${operand.display}`);
        remove.textContent = "×";
        remove.addEventListener("click", () => {
          if (state !== "edit" || !editDraft) {
            return;
          }

          settlePendingEdit();
          editDraft.operands.splice(index, 1);
          renderEditDraft();
          renderExpression();
          input.focus();
        });

        chip.append(value, remove);
        operandChips.append(chip);
      });
    }

    function beginEdit(entry) {
      stopAutoConfirm();
      if (state !== "edit" || !editSnapshot) {
        editSnapshot = captureEditSnapshot();
      }
      pendingEdit = null;
      operator = entry.operator;
      syncOperatorAttribute();
      editDraft = {
        operator: entry.operator,
        operands: entry.operands.map(cloneOperand),
        base: entry.base ? { value: entry.base.value, display: entry.base.display } : null
      };
      input.value = "";
      resetButton.disabled = false;
      clearResult();
      renderEditDraft();
      enterState("edit");
      renderExpression();
      updateStateLabel(`正在编辑 ${operatorGlyphs[entry.operator]} 记录`);
      input.focus();
    }

    function renderHistoryItem(entry) {
      const item = document.createElement("article");
      item.className = "history-item";
      item.setAttribute("data-testid", "history-item");
      item.setAttribute("data-operator", entry.operator);
      item.setAttribute("data-operands", JSON.stringify(entry.operands.map((operand) => operand.display)));
      if (entry.base) {
        item.setAttribute("data-base", entry.base.display);
      }

      const line = document.createElement("div");
      line.className = "history-line";

      const historyExpression = document.createElement("span");
      historyExpression.className = "history-expression";
      historyExpression.setAttribute("data-testid", "history-expression");
      historyExpression.textContent = entry.expression;

      const historyResult = document.createElement("span");
      historyResult.className = "history-result";
      historyResult.setAttribute("data-testid", "history-result");
      historyResult.setAttribute("data-value", formatValue(entry.result));
      historyResult.textContent = formatValue(entry.result);

      line.append(historyExpression, historyResult);

      const editButton = document.createElement("button");
      editButton.type = "button";
      editButton.className = "history-edit";
      editButton.setAttribute("data-testid", "history-edit");
      editButton.textContent = "编辑";
      editButton.addEventListener("click", () => beginEdit(entry));

      item.append(line, editButton);
      return item;
    }

    function appendHistory(entry) {
      history.unshift(entry);
      historyEmpty.hidden = true;
      historyList.prepend(renderHistoryItem(entry));
    }

    function resetToSelect() {
      stopAutoConfirm();
      pendingEdit = null;
      editSnapshot = null;
      operator = null;
      syncOperatorAttribute();
      operands = [];
      editDraft = null;
      editDraftView.hidden = true;
      operandChips.textContent = "";
      input.value = "";
      resetButton.disabled = true;
      clearExpression();
      clearResult();
      enterState("select");
      updateStateLabel("请选择运算类型");
    }

    function chooseOperator(nextOperator) {
      settlePendingEdit();
      if (state === "edit" && editDraft) {
        editDraft.operator = nextOperator;
        renderEditDraft();
        renderExpression();
        updateStateLabel(`正在编辑 ${operatorGlyphs[nextOperator]} 记录`);
        input.focus();
        startAutoConfirm();
        return;
      }

      const preserveOperands = state === "input";
      operator = nextOperator;
      syncOperatorAttribute();
      if (!preserveOperands) {
        operands = [];
        input.value = "";
        clearExpression();
        clearResult();
      }
      resetButton.disabled = false;
      enterState("input");
      renderExpression();
      const base = effectiveBase();
      const baseHint = base ? `，基数 ${base.display}` : "";
      updateStateLabel(preserveOperands
        ? `已更换为 ${operatorGlyphs[nextOperator]}${baseHint}，已输入的数字会保留`
        : `已选择 ${operatorGlyphs[nextOperator]}${baseHint}，请输入数字`);
      input.focus();
      startAutoConfirm();
    }

    function commitInput() {
      if (state !== "select" && state !== "input" && state !== "result" && state !== "error" && state !== "edit") {
        return false;
      }

      const rawValue = input.value.trim();
      if (rawValue === "") {
        return false;
      }

      const numericValue = Number(rawValue);
      if (!Number.isFinite(numericValue)) {
        return false;
      }

      if (state === "select") {
        enterState("input");
        updateStateLabel("请输入数字，或先选择运算类型");
      }

      if (state === "edit" && editDraft) {
        editDraft.operands.push({ value: numericValue, display: rawValue });
        renderEditDraft();
      } else {
        if (state === "result" || state === "error") {
          operands = [];
          clearExpression();
          clearResult();
          enterState("input");
          updateStateLabel(`已开始新的 ${operatorGlyphs[operator]} 计算，请继续输入`);
        }
        operands.push({ value: numericValue, display: rawValue });
      }
      input.value = "";
      renderExpression();
      stopAutoConfirm();
      updateStateLabel(state === "edit"
        ? `已加入 ${rawValue}，可继续编辑或按 = 重算`
        : `已确认 ${rawValue}，可继续输入或按 = 计算`);
      updateUndoHint();
      return true;
    }

    function formatValue(value) {
      return String(Object.is(value, -0) ? 0 : value);
    }

    function showDivisionByZero(activeOperator) {
      stopAutoConfirm();
      pendingEdit = null;
      editSnapshot = null;
      operator = activeOperator;
      syncOperatorAttribute();
      operands = [];
      editDraft = null;
      editDraftView.hidden = true;
      operandChips.textContent = "";
      clearExpression();
      result.textContent = "不能除以零";
      result.removeAttribute("data-value");
      result.setAttribute("data-error", "true");
      input.value = "";
      resetButton.disabled = false;
      enterState("error");
      updateStateLabel("不能除以零；直接输入数字可开始新的计算，或更换运算符");
      input.focus();
    }

    function readOperandInputValues() {
      return Array.from(operandChips.querySelectorAll('[data-testid="operand-input"]'))
        .map((element) => element.value);
    }

    function invalidOperandValue(rawValue) {
      return rawValue.trim() === "" || !Number.isFinite(Number(rawValue));
    }

    function calculate() {
      if (state !== "input" && state !== "result" && state !== "error" && state !== "edit") {
        return;
      }

      stopAutoConfirm();
      settlePendingEdit();

      const wasEditing = state === "edit" && editDraft !== null;
      let activeOperator;
      let activeOperands;
      let activeBase;

      if (wasEditing) {
        const editedValues = readOperandInputValues();
        if (editedValues.length === 0 || editedValues.some(invalidOperandValue)) {
          return;
        }

        editDraft.operands = editedValues.map((rawValue) => ({
          value: Number(rawValue),
          display: rawValue
        }));
        commitInput();

        const currentValues = readOperandInputValues();
        if (currentValues.length === 0 || currentValues.some(invalidOperandValue)) {
          return;
        }

        activeOperator = editDraft.operator;
        activeOperands = currentValues.map((rawValue) => ({
          value: Number(rawValue),
          display: rawValue
        }));
        activeBase = editDraft.base ? { value: editDraft.base.value, display: editDraft.base.display } : null;
      } else {
        commitInput();
        activeOperator = operator;
        activeOperands = operands;
        activeBase = effectiveBase();
      }

      if (!activeOperator || activeOperands.length === 0) {
        return;
      }

      let accumulator = activeBase ? activeBase.value : activeOperands[0].value;
      for (let index = activeBase ? 0 : 1; index < activeOperands.length; index += 1) {
        const nextValue = activeOperands[index].value;
        if (activeOperator === "/" && nextValue === 0) {
          showDivisionByZero(activeOperator);
          return;
        }

        switch (activeOperator) {
          case "+":
            accumulator += nextValue;
            break;
          case "-":
            accumulator -= nextValue;
            break;
          case "*":
            accumulator *= nextValue;
            break;
          case "/":
            accumulator /= nextValue;
            break;
          default:
            return;
        }
      }

      const displayValue = formatValue(accumulator);
      const entry = {
        operator: activeOperator,
        operands: activeOperands.map(cloneOperand),
        base: activeBase,
        expression: expressionText(activeOperator, activeOperands, activeBase),
        result: accumulator
      };
      operator = activeOperator;
      syncOperatorAttribute();
      operands = [];
      expression.textContent = entry.expression;
      appendHistory(entry);
      result.textContent = displayValue;
      result.setAttribute("data-value", displayValue);
      result.removeAttribute("data-error");
      input.value = "";
      resetButton.disabled = false;
      editDraft = null;
      editSnapshot = null;
      pendingEdit = null;
      editDraftView.hidden = true;
      operandChips.textContent = "";
      enterState("result");
      const baseHint = activeBase ? `，基数 ${activeBase.display}` : "";
      updateStateLabel(`计算完成${baseHint}；继续输入数字按回车或 = 即可沿用 ${operatorGlyphs[activeOperator]}`);
      input.focus();
    }

    picker.addEventListener("click", (event) => {
      const button = event.target.closest("[data-op]");
      if (!button) {
        return;
      }

      const nextOperator = button.getAttribute("data-op");
      if (Object.prototype.hasOwnProperty.call(operatorGlyphs, nextOperator)) {
        chooseOperator(nextOperator);
      }
    });

    keypad.addEventListener("click", (event) => {
      const button = event.target.closest("[data-key]");
      if (!button || button.disabled) {
        return;
      }

      const key = button.getAttribute("data-key");
      if (/^[0-9]$/.test(key) || key === ".") {
        appendCharacter(key);
      } else if (key === "backspace") {
        deleteLastCharacter();
      } else if (key === "enter") {
        stopAutoConfirm();
        commitInput();
      } else if (key === "equals") {
        calculate();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.ctrlKey || event.metaKey || event.altKey) {
        return;
      }
      if (settingsPanel.open || (event.target instanceof Element && event.target.closest('[data-testid="settings-panel"]'))) {
        return;
      }
      if (event.target instanceof Element && event.target.closest('[data-testid="operand-input"]')) {
        return;
      }

      const key = event.key;
      if (/^[0-9]$/.test(key) || key === ".") {
        appendCharacter(key);
      } else if (key === "Backspace") {
        deleteLastCharacter();
      } else if (key === "Enter") {
        stopAutoConfirm();
        commitInput();
      } else if (key === "=") {
        calculate();
      } else {
        return;
      }
      event.preventDefault();
    });

    settingsToggle.addEventListener("click", openSettings);
    settingsDone.addEventListener("click", closeSettings);
    settingsPanel.addEventListener("close", () => {
      settingsToggle.setAttribute("aria-expanded", "false");
      if (baseValueInput.value.trim() === "" || !Number.isFinite(Number(baseValueInput.value))) {
        baseValueInput.value = settings.baseText;
      }
      syncSettingsControls();
      settingsToggle.focus();
      startAutoConfirm();
    });
    settingsPanel.addEventListener("click", (event) => {
      if (event.target !== settingsPanel) {
        return;
      }
      const rect = settingsPanel.getBoundingClientRect();
      if (
        event.clientX < rect.left ||
        event.clientX > rect.right ||
        event.clientY < rect.top ||
        event.clientY > rect.bottom
      ) {
        closeSettings();
      }
    });
    window.addEventListener("resize", () => {
      if (settingsPanel.open) {
        placeSettingsPanel();
      }
    });

    autoConfirmSelect.addEventListener("change", () => {
      const value = Number(autoConfirmSelect.value);
      if (AUTO_CONFIRM_STEPS.includes(value)) {
        settings.autoConfirm = value;
        saveSettings();
        syncSettingsIndicator();
      }
    });
    baseToggle.addEventListener("change", () => {
      settings.baseEnabled = baseToggle.checked;
      if (settings.baseEnabled && (settings.baseText.trim() === "" || !Number.isFinite(Number(settings.baseText)))) {
        settings.baseText = "0";
      }
      saveSettings();
      syncSettingsControls();
      renderExpression();
    });
    baseValueInput.addEventListener("input", () => {
      const raw = baseValueInput.value;
      if (raw.trim() !== "" && Number.isFinite(Number(raw))) {
        settings.baseText = raw;
        saveSettings();
        syncSettingsIndicator();
        renderExpression();
      }
    });
    baseValueInput.addEventListener("blur", () => {
      if (baseValueInput.value.trim() === "" || !Number.isFinite(Number(baseValueInput.value))) {
        baseValueInput.value = settings.baseText;
      }
    });

    resetButton.addEventListener("click", resetToSelect);
    editCancelButton.addEventListener("click", cancelEdit);
    input.addEventListener("focus", settlePendingEdit);
    populateAutoConfirmOptions();
    loadSettings();
    syncSettingsControls();
    syncKeypad();
    updateUndoHint();
  })();
</script>
</body>
</html>
