<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>手机计算器</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #f8fafc;
    --muted: #a5b4cf;
    --panel: rgba(22, 32, 51, 0.92);
    --panel-edge: rgba(148, 163, 184, 0.22);
    --field: #0d1524;
    --accent: #f59e0b;
    --accent-ink: #241600;
    --danger: #fecdd3;
    --danger-bg: rgba(190, 24, 93, 0.22);
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
  }

  body {
    min-width: 0;
    overflow-x: hidden;
    background:
      radial-gradient(circle at 15% 0%, rgba(245, 158, 11, 0.15), transparent 34%),
      radial-gradient(circle at 90% 100%, rgba(56, 189, 248, 0.13), transparent 38%),
      #080d17;
    color: var(--ink);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }

  .app {
    width: min(100%, 460px);
    min-height: 100dvh;
    margin: 0 auto;
    padding: 6px 10px max(12px, env(safe-area-inset-bottom));
  }

  .app-header {
    margin: 0 2px 6px;
  }

  h1 {
    margin: 0;
    font-size: clamp(20px, 6vw, 24px);
    line-height: 1.12;
    letter-spacing: 0.01em;
  }

  .subtitle {
    margin: 3px 0 0;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.3;
  }

  .panel {
    min-width: 0;
    padding: 8px;
    border: 1px solid var(--panel-edge);
    border-radius: 18px;
    background: var(--panel);
    box-shadow: 0 22px 70px rgba(0, 0, 0, 0.34);
    backdrop-filter: blur(12px);
  }

  .state-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    min-width: 0;
    margin-bottom: 6px;
  }

  .state-label {
    min-width: 0;
    color: var(--muted);
    font-size: 13px;
    font-weight: 650;
    line-height: 1.35;
  }

  button,
  input {
    font: inherit;
  }

  button {
    min-width: 0;
    min-height: 48px;
    border: 1px solid transparent;
    border-radius: 13px;
    cursor: pointer;
    touch-action: manipulation;
  }

  button:focus-visible,
  input:focus-visible {
    outline: 3px solid #fbbf24;
    outline-offset: 2px;
  }

  button:disabled,
  input:disabled {
    cursor: default;
    opacity: 0.52;
  }

  .reset-button {
    flex: 0 0 auto;
    width: 96px;
    min-height: 44px;
    padding: 0 8px;
    border-color: var(--panel-edge);
    background: #18243a;
    color: var(--ink);
    font-size: 12px;
    font-weight: 650;
  }

  .op-picker {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 6px;
    min-width: 0;
  }

  .op-picker[hidden] {
    display: none;
  }

  .op-button {
    width: 100%;
    min-height: 44px;
    border-color: rgba(251, 191, 36, 0.25);
    background: linear-gradient(180deg, #26344d, #1c293f);
    color: #fde68a;
    font-size: 22px;
    font-weight: 750;
    line-height: 1;
  }

  .calc-input {
    display: block;
    width: 100%;
    min-width: 0;
    min-height: 44px;
    padding: 8px 12px;
    border: 1px solid rgba(148, 163, 184, 0.3);
    border-radius: 12px;
    background: var(--field);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.25;
    cursor: default;
  }

  .calc-input::placeholder {
    color: #72819b;
    font-size: 15px;
  }

  .hint {
    display: none;
  }

  .display {
    min-width: 0;
    margin-top: 6px;
    padding: 6px 8px;
    border: 1px solid rgba(148, 163, 184, 0.16);
    border-radius: 13px;
    background: rgba(7, 12, 22, 0.76);
  }

  .display-label {
    display: none;
  }

  .expression {
    min-height: 20px;
    overflow-wrap: anywhere;
    color: #dbeafe;
    font-size: 15px;
    line-height: 1.35;
    word-break: break-word;
  }

  .result {
    min-height: 34px;
    margin-top: 2px;
    overflow-wrap: anywhere;
    color: var(--accent);
    font-size: clamp(26px, 8vw, 34px);
    font-weight: 760;
    line-height: 1.05;
    word-break: break-word;
  }

  .result[data-error="true"] {
    min-height: 34px;
    padding: 5px 8px;
    border: 1px solid rgba(251, 113, 133, 0.32);
    border-radius: 9px;
    background: var(--danger-bg);
    color: var(--danger);
    font-size: 15px;
    line-height: 1.35;
  }

  .keypad {
    min-width: 0;
    margin-top: 6px;
    padding: 6px;
    border: 1px solid rgba(148, 163, 184, 0.18);
    border-radius: 14px;
    background: rgba(7, 12, 22, 0.42);
  }

  .keypad-pad {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    grid-template-areas:
      "d7 d8 d9 back"
      "d4 d5 d6 enter"
      "d1 d2 d3 enter"
      "d0 dot eq eq";
    grid-auto-rows: minmax(48px, auto);
    gap: 6px;
    min-width: 0;
    margin-top: 6px;
  }

  .key {
    width: 100%;
    min-height: 48px;
    padding: 0 4px;
    border-color: rgba(148, 163, 184, 0.24);
    background: linear-gradient(180deg, #202d44, #172236);
    color: var(--ink);
    font-size: 21px;
    font-weight: 750;
    line-height: 1;
  }

  .key[data-key="0"] { grid-area: d0; }
  .key[data-key="1"] { grid-area: d1; }
  .key[data-key="2"] { grid-area: d2; }
  .key[data-key="3"] { grid-area: d3; }
  .key[data-key="4"] { grid-area: d4; }
  .key[data-key="5"] { grid-area: d5; }
  .key[data-key="6"] { grid-area: d6; }
  .key[data-key="7"] { grid-area: d7; }
  .key[data-key="8"] { grid-area: d8; }
  .key[data-key="9"] { grid-area: d9; }
  .key[data-key="."] { grid-area: dot; }

  .key[data-key="backspace"] {
    grid-area: back;
    color: #fecdd3;
    font-size: 15px;
  }

  .key[data-key="enter"] {
    grid-area: enter;
    border-color: rgba(56, 189, 248, 0.3);
    background: linear-gradient(180deg, #1e3a5f, #14263f);
    color: #bae6fd;
    font-size: 16px;
  }

  .key[data-key="equals"] {
    grid-area: eq;
    background: linear-gradient(180deg, #fbbf24, #f59e0b);
    color: var(--accent-ink);
    font-size: 28px;
    font-weight: 800;
  }

  .edit-draft {
    min-width: 0;
    margin-top: 6px;
    padding: 8px;
    border: 1px solid rgba(251, 191, 36, 0.3);
    border-radius: 16px;
    background: rgba(245, 158, 11, 0.08);
  }

  .edit-draft[hidden] {
    display: none;
  }

  .edit-draft-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    min-width: 0;
    color: #fde68a;
    font-size: 14px;
    font-weight: 700;
  }

  .edit-operator {
    display: inline-grid;
    place-items: center;
    min-width: 32px;
    min-height: 32px;
    padding: 0 8px;
    border: 1px solid rgba(251, 191, 36, 0.4);
    border-radius: 9px;
    background: rgba(245, 158, 11, 0.16);
    color: #fef3c7;
    font-size: 20px;
  }

  .operand-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    min-width: 0;
    margin-top: 10px;
  }

  .operand-chips:empty::after {
    content: "暂无可计算数字";
    color: #c7b68f;
    font-size: 13px;
    line-height: 44px;
  }

  .operand-chip {
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
    max-width: 100%;
    padding-left: 10px;
    border: 1px solid rgba(148, 163, 184, 0.26);
    border-radius: 12px;
    background: rgba(13, 21, 36, 0.92);
  }

  .operand-input {
    width: 76px;
    min-width: 44px;
    min-height: 44px;
    padding: 8px 10px;
    border: 1px solid rgba(148, 163, 184, 0.42);
    border-radius: 9px;
    background: #111c2e;
    color: var(--ink);
    font-size: 16px;
    line-height: 1.25;
    text-align: center;
  }

  .operand-remove {
    flex: 0 0 auto;
    width: 44px;
    min-width: 44px;
    height: 44px;
    min-height: 44px;
    padding: 0;
    border-color: rgba(251, 113, 133, 0.28);
    background: rgba(190, 24, 93, 0.2);
    color: #fecdd3;
    font-size: 20px;
    line-height: 1;
  }

  .history {
    min-width: 0;
    margin-top: 10px;
    padding: 12px;
    border: 1px solid var(--panel-edge);
    border-radius: 20px;
    background: var(--panel);
  }

  .history-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    min-width: 0;
    margin-bottom: 10px;
  }

  .history-title {
    margin: 0;
    font-size: 16px;
    line-height: 1.3;
  }

  .history-note {
    color: var(--muted);
    font-size: 12px;
  }

  .history-list {
    display: grid;
    gap: 8px;
    min-width: 0;
  }

  .history-empty {
    margin: 0;
    color: #8291aa;
    font-size: 13px;
    line-height: 1.5;
  }

  .history-item {
    min-width: 0;
    padding: 10px;
    border: 1px solid rgba(148, 163, 184, 0.18);
    border-radius: 14px;
    background: rgba(7, 12, 22, 0.58);
  }

  .history-line {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 10px;
    min-width: 0;
  }

  .history-expression {
    flex: 1 1 130px;
    min-width: 0;
    overflow-wrap: anywhere;
    color: #dbeafe;
    font-size: 16px;
    line-height: 1.45;
  }

  .history-result {
    flex: 0 0 auto;
    overflow-wrap: anywhere;
    color: var(--accent);
    font-size: 20px;
    font-weight: 750;
    line-height: 1.3;
  }

  .history-edit {
    width: 100%;
    min-height: 44px;
    margin-top: 8px;
    border-color: rgba(251, 191, 36, 0.24);
    background: #1c293f;
    color: #fde68a;
    font-size: 14px;
    font-weight: 700;
  }

  @media (max-width: 350px) {
    .app {
      padding-left: 10px;
      padding-right: 10px;
    }

    .panel {
      padding: 10px;
    }

    .op-picker {
      gap: 7px;
    }
  }
</style>
</head>
<body>
<main class="app" data-state="select">
  <header class="app-header">
    <h1>手机计算器</h1>
    <p class="subtitle">选运算符，用屏幕数字键盘输入；= 后沿用运算符</p>
  </header>

  <section class="panel" aria-label="计算器">
    <div class="state-row">
      <span class="state-label" id="state-label" aria-live="polite">请选择运算类型</span>
      <button class="reset-button" type="button" data-testid="key-op" disabled>运算类型</button>
    </div>

    <input
      class="calc-input"
      id="calc-input"
      data-testid="calc-input"
      type="text"
      inputmode="none"
      autocomplete="off"
      spellcheck="false"
      placeholder="用下方数字键盘输入"
      aria-describedby="calc-hint"
      aria-label="数字显示"
      readonly
    >
    <p class="hint" id="calc-hint">用屏幕数字键盘输入；回车确认数字，等号计算。</p>

    <div class="display" aria-label="计算过程">
      <div class="display-label">算式</div>
      <div class="expression" data-testid="expression" aria-live="polite"></div>
      <div class="display-label">结果</div>
      <div class="result" data-testid="result" aria-live="polite"></div>
    </div>

    <section class="keypad" data-testid="keypad" aria-label="数字键盘">
      <div class="op-picker" data-testid="op-picker" role="group" aria-label="选择运算类型">
        <button class="op-button" type="button" data-op="+" aria-label="加法">+</button>
        <button class="op-button" type="button" data-op="-" aria-label="减法">-</button>
        <button class="op-button" type="button" data-op="*" aria-label="乘法">*</button>
        <button class="op-button" type="button" data-op="/" aria-label="除法">/</button>
      </div>

      <div class="keypad-pad">
        <button class="key" type="button" data-key="7" aria-label="数字 7">7</button>
        <button class="key" type="button" data-key="8" aria-label="数字 8">8</button>
        <button class="key" type="button" data-key="9" aria-label="数字 9">9</button>
        <button class="key" type="button" data-key="backspace" aria-label="退格">退格</button>
        <button class="key" type="button" data-key="4" aria-label="数字 4">4</button>
        <button class="key" type="button" data-key="5" aria-label="数字 5">5</button>
        <button class="key" type="button" data-key="6" aria-label="数字 6">6</button>
        <button class="key" type="button" data-key="enter" aria-label="回车确认数字">回车</button>
        <button class="key" type="button" data-key="1" aria-label="数字 1">1</button>
        <button class="key" type="button" data-key="2" aria-label="数字 2">2</button>
        <button class="key" type="button" data-key="3" aria-label="数字 3">3</button>
        <button class="key" type="button" data-key="0" aria-label="数字 0">0</button>
        <button class="key" type="button" data-key="." aria-label="小数点">.</button>
        <button class="key" type="button" data-key="equals" data-testid="key-equals" aria-label="等于">=</button>
      </div>
    </section>

    <section class="edit-draft" data-testid="edit-draft" aria-label="编辑草稿" hidden>
      <div class="edit-draft-head">
        <span>编辑草稿</span>
        <span class="edit-operator" data-testid="edit-operator" aria-hidden="true">+</span>
        <span id="edit-hint">换运算符不会清空数字；回车追加数字。</span>
      </div>
      <div class="operand-chips" data-testid="operand-chips"></div>
    </section>
  </section>

  <section class="history" data-testid="history" aria-label="计算历史">
    <div class="history-head">
      <h2 class="history-title">计算历史</h2>
      <span class="history-note">仅当前页面</span>
    </div>
    <div class="history-list" data-testid="history-list"></div>
    <p class="history-empty" data-testid="history-empty">还没有计算记录。</p>
  </section>
</main>

<script>
  (() => {
    "use strict";

    const app = document.querySelector(".app");
    const picker = document.querySelector('[data-testid="op-picker"]');
    const input = document.querySelector('[data-testid="calc-input"]');
    const expression = document.querySelector('[data-testid="expression"]');
    const result = document.querySelector('[data-testid="result"]');
    const equalsButton = document.querySelector('[data-testid="key-equals"]');
    const resetButton = document.querySelector('[data-testid="key-op"]');
    const keypad = document.querySelector('[data-testid="keypad"]');
    const keyButtons = Array.from(keypad.querySelectorAll('[data-key]'));
    const opButtons = Array.from(picker.querySelectorAll('[data-op]'));
    const stateLabel = document.querySelector("#state-label");
    const historyList = document.querySelector('[data-testid="history-list"]');
    const historyEmpty = document.querySelector('[data-testid="history-empty"]');
    const editDraftView = document.querySelector('[data-testid="edit-draft"]');
    const editOperatorView = document.querySelector('[data-testid="edit-operator"]');
    const operandChips = document.querySelector('[data-testid="operand-chips"]');

    const operatorGlyphs = {
      "+": "+",
      "-": "-",
      "*": "*",
      "/": "/"
    };

    let state = "select";
    let operator = null;
    let operands = [];
    let history = [];
    let editDraft = null;

    function enterState(nextState) {
      state = nextState;
      app.dataset.state = nextState;
      syncKeypad();
    }

    function syncOperatorAttribute() {
      if (operator) {
        app.dataset.operator = operator;
      } else {
        delete app.dataset.operator;
      }
    }

    function syncKeypad() {
      const disabled = state === "select";
      keyButtons.forEach((button) => {
        button.disabled = disabled;
      });
      opButtons.forEach((button) => {
        button.disabled = false;
      });
    }

    function appendCharacter(character) {
      if (state === "select") {
        return;
      }
      if (character === "." && input.value.includes(".")) {
        return;
      }
      input.value += character;
    }

    function deleteLastCharacter() {
      if (state === "select") {
        return;
      }
      input.value = input.value.slice(0, -1);
    }

    function clearResult() {
      result.textContent = "";
      result.removeAttribute("data-value");
      result.removeAttribute("data-error");
    }

    function clearExpression() {
      expression.textContent = "";
    }

    function cloneOperand(operand) {
      return { value: operand.value, display: operand.display };
    }

    function expressionText(activeOperator, activeOperands) {
      if (!activeOperator || activeOperands.length === 0) {
        return "";
      }

      return activeOperands
        .map((operand) => operand.display)
        .join(` ${operatorGlyphs[activeOperator]} `);
    }

    function liveExpressionText(activeOperator, activeOperands) {
      const base = expressionText(activeOperator, activeOperands);
      if (!base || activeOperands.length !== 1) {
        return base;
      }

      return `${base} ${operatorGlyphs[activeOperator]}`;
    }

    function renderExpression() {
      if (state === "edit" && editDraft) {
        expression.textContent = liveExpressionText(editDraft.operator, editDraft.operands);
        return;
      }

      if (!operator || operands.length === 0) {
        clearExpression();
        return;
      }

      expression.textContent = liveExpressionText(operator, operands);
    }

    function updateStateLabel(label) {
      stateLabel.textContent = label;
    }

    function renderEditDraft() {
      if (!editDraft) {
        editDraftView.hidden = true;
        operandChips.textContent = "";
        return;
      }

      editDraftView.hidden = false;
      editDraftView.setAttribute("data-operator", editDraft.operator);
      editOperatorView.textContent = operatorGlyphs[editDraft.operator];
      operandChips.textContent = "";

      editDraft.operands.forEach((operand, index) => {
        const chip = document.createElement("div");
        chip.className = "operand-chip";
        chip.setAttribute("data-testid", "operand-chip");
        chip.setAttribute("data-value", operand.display);

        const value = document.createElement("input");
        value.type = "text";
        value.inputMode = "decimal";
        value.autocomplete = "off";
        value.spellcheck = false;
        value.className = "operand-input";
        value.setAttribute("data-testid", "operand-input");
        value.setAttribute("aria-label", `编辑数字 ${operand.display}`);
        value.value = operand.display;
        value.addEventListener("input", () => {
          if (state !== "edit" || !editDraft || !editDraft.operands[index]) {
            return;
          }

          editDraft.operands[index] = {
            value: Number(value.value),
            display: value.value
          };
          chip.setAttribute("data-value", value.value);
          renderExpression();
        });

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "operand-remove";
        remove.setAttribute("data-testid", "operand-remove");
        remove.setAttribute("aria-label", `删除数字 ${operand.display}`);
        remove.textContent = "×";
        remove.addEventListener("click", () => {
          if (state !== "edit" || !editDraft) {
            return;
          }

          editDraft.operands.splice(index, 1);
          renderEditDraft();
          renderExpression();
          input.focus();
        });

        chip.append(value, remove);
        operandChips.append(chip);
      });
    }

    function beginEdit(entry) {
      operator = entry.operator;
      syncOperatorAttribute();
      editDraft = {
        operator: entry.operator,
        operands: entry.operands.map(cloneOperand)
      };
      input.value = "";
      resetButton.disabled = false;
      clearResult();
      renderEditDraft();
      enterState("edit");
      renderExpression();
      updateStateLabel(`正在编辑 ${operatorGlyphs[entry.operator]} 记录`);
      input.focus();
    }

    function renderHistoryItem(entry) {
      const item = document.createElement("article");
      item.className = "history-item";
      item.setAttribute("data-testid", "history-item");
      item.setAttribute("data-operator", entry.operator);
      item.setAttribute("data-operands", JSON.stringify(entry.operands.map((operand) => operand.display)));

      const line = document.createElement("div");
      line.className = "history-line";

      const historyExpression = document.createElement("span");
      historyExpression.className = "history-expression";
      historyExpression.setAttribute("data-testid", "history-expression");
      historyExpression.textContent = entry.expression;

      const historyResult = document.createElement("span");
      historyResult.className = "history-result";
      historyResult.setAttribute("data-testid", "history-result");
      historyResult.setAttribute("data-value", formatValue(entry.result));
      historyResult.textContent = formatValue(entry.result);

      line.append(historyExpression, historyResult);

      const editButton = document.createElement("button");
      editButton.type = "button";
      editButton.className = "history-edit";
      editButton.setAttribute("data-testid", "history-edit");
      editButton.textContent = "编辑";
      editButton.addEventListener("click", () => beginEdit(entry));

      item.append(line, editButton);
      return item;
    }

    function appendHistory(entry) {
      history.unshift(entry);
      historyEmpty.hidden = true;
      historyList.prepend(renderHistoryItem(entry));
    }

    function resetToSelect() {
      operator = null;
      syncOperatorAttribute();
      operands = [];
      editDraft = null;
      editDraftView.hidden = true;
      operandChips.textContent = "";
      input.value = "";
      resetButton.disabled = true;
      clearExpression();
      clearResult();
      enterState("select");
      updateStateLabel("请选择运算类型");
    }

    function chooseOperator(nextOperator) {
      if (state === "edit" && editDraft) {
        editDraft.operator = nextOperator;
        renderEditDraft();
        renderExpression();
        updateStateLabel(`正在编辑 ${operatorGlyphs[nextOperator]} 记录`);
        input.focus();
        return;
      }

      const preserveOperands = state === "input";
      operator = nextOperator;
      syncOperatorAttribute();
      if (!preserveOperands) {
        operands = [];
        input.value = "";
        clearExpression();
        clearResult();
      }
      resetButton.disabled = false;
      enterState("input");
      renderExpression();
      updateStateLabel(preserveOperands
        ? `已更换为 ${operatorGlyphs[nextOperator]}，已输入的数字会保留`
        : `已选择 ${operatorGlyphs[nextOperator]}，请输入数字`);
      input.focus();
    }

    function commitInput() {
      if (state !== "input" && state !== "result" && state !== "error" && state !== "edit") {
        return false;
      }

      const rawValue = input.value.trim();
      if (rawValue === "") {
        return false;
      }

      const numericValue = Number(rawValue);
      if (!Number.isFinite(numericValue)) {
        return false;
      }

      if (state === "edit" && editDraft) {
        editDraft.operands.push({ value: numericValue, display: rawValue });
        renderEditDraft();
      } else {
        if (state === "result" || state === "error") {
          operands = [];
          clearExpression();
          clearResult();
          enterState("input");
          updateStateLabel(`已开始新的 ${operatorGlyphs[operator]} 计算，请继续输入`);
        }
        operands.push({ value: numericValue, display: rawValue });
      }
      input.value = "";
      renderExpression();
      return true;
    }

    function formatValue(value) {
      return String(Object.is(value, -0) ? 0 : value);
    }

    function showDivisionByZero(activeOperator) {
      operator = activeOperator;
      syncOperatorAttribute();
      operands = [];
      editDraft = null;
      editDraftView.hidden = true;
      operandChips.textContent = "";
      clearExpression();
      result.textContent = "不能除以零";
      result.removeAttribute("data-value");
      result.setAttribute("data-error", "true");
      input.value = "";
      resetButton.disabled = false;
      enterState("error");
      updateStateLabel("不能除以零；直接输入数字可开始新的计算，或更换运算符");
      input.focus();
    }

    function readOperandInputValues() {
      return Array.from(operandChips.querySelectorAll('[data-testid="operand-input"]'))
        .map((element) => element.value);
    }

    function invalidOperandValue(rawValue) {
      return rawValue.trim() === "" || !Number.isFinite(Number(rawValue));
    }

    function calculate() {
      if (state !== "input" && state !== "result" && state !== "error" && state !== "edit") {
        return;
      }

      const wasEditing = state === "edit" && editDraft !== null;
      let activeOperator;
      let activeOperands;

      if (wasEditing) {
        const editedValues = readOperandInputValues();
        if (editedValues.length === 0 || editedValues.some(invalidOperandValue)) {
          return;
        }

        editDraft.operands = editedValues.map((rawValue) => ({
          value: Number(rawValue),
          display: rawValue
        }));
        commitInput();

        const currentValues = readOperandInputValues();
        if (currentValues.length === 0 || currentValues.some(invalidOperandValue)) {
          return;
        }

        activeOperator = editDraft.operator;
        activeOperands = currentValues.map((rawValue) => ({
          value: Number(rawValue),
          display: rawValue
        }));
      } else {
        commitInput();
        activeOperator = operator;
        activeOperands = operands;
      }

      if (!activeOperator || activeOperands.length === 0) {
        return;
      }

      let accumulator = activeOperands[0].value;
      for (let index = 1; index < activeOperands.length; index += 1) {
        const nextValue = activeOperands[index].value;
        if (activeOperator === "/" && nextValue === 0) {
          showDivisionByZero(activeOperator);
          return;
        }

        switch (activeOperator) {
          case "+":
            accumulator += nextValue;
            break;
          case "-":
            accumulator -= nextValue;
            break;
          case "*":
            accumulator *= nextValue;
            break;
          case "/":
            accumulator /= nextValue;
            break;
          default:
            return;
        }
      }

      const displayValue = formatValue(accumulator);
      const entry = {
        operator: activeOperator,
        operands: activeOperands.map(cloneOperand),
        expression: expressionText(activeOperator, activeOperands),
        result: accumulator
      };
      operator = activeOperator;
      syncOperatorAttribute();
      operands = [];
      expression.textContent = entry.expression;
      appendHistory(entry);
      result.textContent = displayValue;
      result.setAttribute("data-value", displayValue);
      result.removeAttribute("data-error");
      input.value = "";
      resetButton.disabled = false;
      editDraft = null;
      editDraftView.hidden = true;
      operandChips.textContent = "";
      enterState("result");
      updateStateLabel(`计算完成；继续输入数字按回车或 = 即可沿用 ${operatorGlyphs[activeOperator]}`);
      input.focus();
    }

    picker.addEventListener("click", (event) => {
      const button = event.target.closest("[data-op]");
      if (!button) {
        return;
      }

      const nextOperator = button.getAttribute("data-op");
      if (Object.prototype.hasOwnProperty.call(operatorGlyphs, nextOperator)) {
        chooseOperator(nextOperator);
      }
    });

    keypad.addEventListener("click", (event) => {
      const button = event.target.closest("[data-key]");
      if (!button || button.disabled) {
        return;
      }

      const key = button.getAttribute("data-key");
      if (/^[0-9]$/.test(key) || key === ".") {
        appendCharacter(key);
      } else if (key === "backspace") {
        deleteLastCharacter();
      } else if (key === "enter") {
        commitInput();
      } else if (key === "equals") {
        calculate();
      }
    });

    resetButton.addEventListener("click", resetToSelect);
    syncKeypad();
  })();
</script>
</body>
</html>
